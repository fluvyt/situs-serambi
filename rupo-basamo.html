      <h2>Rupo Basamo</h2>
      <p>Ketik teks biasa di bawah ini, dan lihat perubahannya secara langsung!</p>
    </div>

    <div class="converter-container">
      
      <!-- Left Side: User Input -->
      <div class="input-group">
        <label for="inputText" class="input-label">Teks Biasa (Latin)</label>
        <textarea id="inputText" class="md3-textarea" placeholder="Ketik kata atau kalimat di sini..."></textarea>
      </div>

      <!-- Center: An Arrow Icon (Optional but looks nice) -->

        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.01 11H4v2h12.01v3L20 12l-3.99-4v3z"/>
        </svg>
      </div>

      <!-- Right Side: Output Result -->
      <div class="input-group">
        <label for="outputText" class="input-label">Hasil Tulisan</label>
        <div id="outputText" class="md3-textarea readonly-output">
          <!-- The JavaScript will inject the translated text here -->
        </div>
        
        <!-- NEW: Download Button -->
        <button id="downloadBtn" class="btn-primary download-btn">Unduh Gambar</button>
      </div>

    </div>
  </section>
